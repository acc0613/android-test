name: Check PR code coverage

on:
  workflow_dispatch:
  pull_request:
    types: [ labeled ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event.label.name == 'pr_build' }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Change wrapper permissions
        run: chmod +x ./gradlew
      - name: Gradle tasks
        shell: bash
        run: ./gradlew tasks --all
      - name: Gradle generate code coverage report
        shell: bash
        run: ./gradlew createReleaseUnitTestCoverageReport
      - name: Coveralls Parallel
        id: cv-parallel
        uses: coverallsapp/github-action@v2
        with:
          compare-ref: main
          file: /Users/runner/work/android-test/android-test/app/build/reports/coverage/test/release/report.xml
          format: jacoco
      # - name: Coveralls Finished
      #   id: cv-finished
      #   uses: coverallsapp/github-action@v2
      #   with:
      #     parallel-finished: true